# Asks every outside contributor to accept CLA.md on their first pull request.
#
# The action is archived upstream (no new releases), so it is pinned to the
# commit of its last release, v2.6.1, rather than to a movable tag.
#
# `pull_request_target` runs this workflow from the base branch with write
# access. That is safe here only because it never checks out or runs the pull
# request's code — keep it that way.
#
# Signatures are committed to the `cla-signatures` branch, not to `main`, so
# signing does not add commits to the project's history. That branch must exist
# and must not be protected.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check the CLA
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/evlat/evlat/blob/main/CLA.md'
          path-to-signatures: 'signatures/v1/cla.json'
          branch: 'cla-signatures'
          allowlist: 'kalaomer,dependabot[bot],github-actions[bot]'
